<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#E1F5FE" rx="15"/>

  <!-- 地面阴影 -->
  <ellipse cx="250" cy="360" rx="120" ry="10" fill="#B3E5FC"/>

  <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" dur="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <!-- 自行车 -->
  <g transform="translate(0, 20)" filter="url(#shadow)">
    <!-- 后轮 -->
    <circle cx="150" cy="320" r="55" fill="none" stroke="#37474F" stroke-width="6"/>
    <circle cx="150" cy="320" r="12" fill="#37474F"/>
    <g stroke="#90A4AE" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 150 320" to="360 150 320" dur="2s" repeatCount="indefinite"/>
      <line x1="150" y1="265" x2="150" y2="375"/>
      <line x1="95" y1="320" x2="205" y2="320"/>
      <line x1="110" y1="280" x2="190" y2="360"/>
      <line x1="190" y1="280" x2="110" y2="360"/>
    </g>

    <!-- 前轮 -->
    <circle cx="350" cy="320" r="55" fill="none" stroke="#37474F" stroke-width="6"/>
    <circle cx="350" cy="320" r="12" fill="#37474F"/>
    <g stroke="#90A4AE" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 350 320" to="360 350 320" dur="2s" repeatCount="indefinite"/>
      <line x1="350" y1="265" x2="350" y2="375"/>
      <line x1="295" y1="320" x2="405" y2="320"/>
      <line x1="310" y1="280" x2="390" y2="360"/>
      <line x1="390" y1="280" x2="310" y2="360"/>
    </g>

    <!-- 车架 -->
    <path d="M150,320 L180,240 L350,240 L350,320" fill="none" stroke="#263238" stroke-width="7" stroke-linejoin="round"/>
    <path d="M180,240 L150,320" fill="none" stroke="#263238" stroke-width="7" stroke-linejoin="round"/>

    <!-- 座椅 -->
    <path d="M180,240 Q190,225 200,240" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>

    <!-- 车把 -->
    <path d="M350,240 L350,220" stroke="#263238" stroke-width="6"/>
    <path d="M350,220 L340,210 M350,220 L360,210" stroke="#263238" stroke-width="4"/>

    <!-- 脚踏板 -->
    <line x1="150" y1="320" x2="150" y2="350" stroke="#37474F" stroke-width="5"/>
    <line x1="150" y1="350" x2="140" y2="350" stroke="#37474F" stroke-width="4"/>
    <line x1="150" y1="350" x2="160" y2="350" stroke="#37474F" stroke-width="4"/>
  </g>

  <!-- 鹈鹕 -->
  <g transform="translate(0, 20)" filter="url(#shadow)">
    <!-- 身体 -->
    <path d="M130,200 Q160,290 210,290 Q260,290 280,220 Z" fill="#FFFFFF"/>
    
    <!-- 脖子 -->
    <path d="M280,220 Q300,170 330,150" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    
    <!-- 头部 -->
    <circle cx="330" cy="150" r="20" fill="#FFFFFF"/>
    
    <!-- 眼睛 -->
    <circle cx="335" cy="145" r="3" fill="#000000"/>
    <circle cx="336" cy="144" r="1" fill="#FFFFFF"/>

    <!-- 喙 -->
    <path d="M350,150 L390,155 L350,160 Z" fill="#FF8A80"/>
    <line x1="350" y1="155" x2="390" y2="155" stroke="#D32F2F" stroke-width="1"/>

    <!-- 喙下的袋子 -->
    <path d="M350,155 Q370,165 350,165" fill="#FF5252" opacity="0.6"/>

    <!-- 翅膀 (放在车把上) -->
    <path d="M280,220 Q310,250 340,240" fill="#E1F5FE" stroke="#B3E5FC" stroke-width="1"/>

    <!-- 腿 -->
    <g stroke="#FF8A80" stroke-width="5" stroke-linecap="round">
      <path d="M180,290 L180,330 L170,330"/> <!-- 后腿 -->
      <path d="M200,290 L200,330 L210,330"/> <!-- 前腿 -->
    </g>
  </g>
  </g>
</svg>