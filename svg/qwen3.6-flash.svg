<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Sky Background -->
  <rect width="800" height="600" fill="#87CEEB" />

  <!-- Clouds -->
  <g id="clouds">
    <!-- Cloud 1 (Top Left) -->
    <g transform="translate(100, 80)">
      <circle cx="0" cy="0" r="30" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="40" cy="-20" r="40" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="80" cy="0" r="30" fill="#FFF" stroke="#000" stroke-width="8"/>
      <rect x="0" y="-20" width="80" height="50" fill="#FFF" stroke="#000" stroke-width="8"/>
    </g>
    
    <!-- Cloud 2 (Top Right) -->
    <g transform="translate(550, 60)">
      <circle cx="0" cy="0" r="25" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="30" cy="-15" r="35" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="60" cy="0" r="25" fill="#FFF" stroke="#000" stroke-width="8"/>
      <rect x="0" y="-15" width="60" height="40" fill="#FFF" stroke="#000" stroke-width="8"/>
    </g>

    <!-- Cloud 3 (Middle Left) -->
    <g transform="translate(50, 250)">
      <circle cx="0" cy="0" r="20" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="25" cy="-10" r="30" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="50" cy="0" r="20" fill="#FFF" stroke="#000" stroke-width="8"/>
      <rect x="0" y="-10" width="50" height="30" fill="#FFF" stroke="#000" stroke-width="8"/>
    </g>
  </g>

  <!-- Ground Line -->
  <line x1="0" y1="540" x2="800" y2="540" stroke="#000" stroke-width="8" />

  <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" dur="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <!-- BICYCLE -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <circle cx="250" cy="450" r="90" fill="none" stroke="#000" stroke-width="16"/>
    <circle cx="250" cy="450" r="75" fill="none" stroke="#CCC" stroke-width="8"/>
    <circle cx="250" cy="450" r="10" fill="#000"/>
    <!-- Spokes Back -->
    <g><animateTransform attributeName="transform" type="rotate" from="0 250 450" to="360 250 450" dur="2s" repeatCount="indefinite"/>
    <line x1="250" y1="360" x2="250" y2="540" stroke="#000" stroke-width="6"/>
    <line x1="160" y1="450" x2="340" y2="450" stroke="#000" stroke-width="6"/>
    <line x1="186" y1="386" x2="314" y2="514" stroke="#000" stroke-width="6"/>
    <line x1="186" y1="514" x2="314" y2="386" stroke="#000" stroke-width="6"/>
    </g>

    <!-- Front Wheel -->
    <circle cx="550" cy="450" r="90" fill="none" stroke="#000" stroke-width="16"/>
    <circle cx="550" cy="450" r="75" fill="none" stroke="#CCC" stroke-width="8"/>
    <circle cx="550" cy="450" r="10" fill="#000"/>
    <!-- Spokes Front -->
    <g><animateTransform attributeName="transform" type="rotate" from="0 550 450" to="360 550 450" dur="2s" repeatCount="indefinite"/>
    <line x1="550" y1="360" x2="550" y2="540" stroke="#000" stroke-width="6"/>
    <line x1="460" y1="450" x2="640" y2="450" stroke="#000" stroke-width="6"/>
    <line x1="486" y1="386" x2="614" y2="514" stroke="#000" stroke-width="6"/>
    <line x1="486" y1="514" x2="614" y2="386" stroke="#000" stroke-width="6"/>
    </g>

    <!-- Bicycle Frame (Bright Red) -->
    <path d="M 250 450 L 350 250 L 400 450 L 550 450" fill="none" stroke="#FF3B30" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="550" y1="450" x2="530" y2="280" stroke="#FF3B30" stroke-width="16" stroke-linecap="round"/>
    <line x1="530" y1="280" x2="480" y2="280" stroke="#FF3B30" stroke-width="16" stroke-linecap="round"/>

    <!-- Seat Post & Seat -->
    <line x1="350" y1="250" x2="340" y2="220" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <path d="M 300 220 Q 340 200 380 220 Q 390 230 380 240 L 300 240 Z" fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Handlebars -->
    <path d="M 480 280 Q 470 250 490 230" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <line x1="470" y1="230" x2="510" y2="230" stroke="#000" stroke-width="12" stroke-linecap="round"/>

    <!-- Pedals & Cranks -->
    <circle cx="400" cy="450" r="20" fill="#000"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 400 450" to="360 400 450" dur="2s" repeatCount="indefinite"/>
    <line x1="400" y1="450" x2="350" y2="400" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <line x1="400" y1="450" x2="450" y2="500" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <rect x="330" y="390" width="40" height="20" rx="5" fill="#000" transform="rotate(-30 350 400)"/>
    <rect x="430" y="490" width="40" height="20" rx="5" fill="#000" transform="rotate(-30 450 500)"/>
    </g>
  </g>

  <!-- PELICAN -->
  <g id="pelican">
    <!-- Back Leg (Left Leg) -->
    <path d="M 360 350 L 320 380 L 350 400" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 320 380 L 300 410 L 330 410 Z" fill="#FFA500" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Fluffy Body Layers -->
    <g id="body-fluff">
      <circle cx="380" cy="280" r="70" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="330" cy="250" r="50" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="430" cy="250" r="50" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="310" cy="310" r="45" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="450" cy="310" r="45" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="350" cy="210" r="45" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="410" cy="210" r="45" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="380" cy="330" r="50" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="300" cy="280" r="35" fill="#FFF" stroke="#000" stroke-width="8"/>
      <circle cx="460" cy="280" r="35" fill="#FFF" stroke="#000" stroke-width="8"/>
    </g>

    <!-- Wing -->
    <path d="M 330 280 Q 380 350 440 280 Q 380 250 330 280 Z" fill="#FFF" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 350 300 Q 380 330 410 300" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M 410 220 Q 450 180 430 150 Q 400 180 380 220 Z" fill="#FFF" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="430" cy="150" r="35" fill="#FFF" stroke="#000" stroke-width="8"/>

    <!-- Eye -->
    <circle cx="445" cy="140" r="6" fill="#000"/>
    <circle cx="447" cy="138" r="2" fill="#FFF"/>

    <!-- Beak Top -->
    <path d="M 450 140 Q 550 140 620 180 Q 550 200 450 180 Z" fill="#FFA500" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Beak Pouch -->
    <path d="M 450 180 Q 550 200 620 180 Q 550 260 450 220 Z" fill="#FFD700" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Nostril -->
    <ellipse cx="500" cy="155" rx="8" ry="4" fill="#000"/>

    <!-- Front Leg (Right Leg) -->
    <path d="M 400 350 L 450 400 L 450 500" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 450 400 L 430 430 L 460 430 Z" fill="#FFA500" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  </g>
  </g>
</svg>