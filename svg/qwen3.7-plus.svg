<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Ground -->
  <rect x="0" y="373" width="500" height="27" fill="#8B7355"/>
  <line x1="0" y1="375" x2="500" y2="375" stroke="#6B5335" stroke-width="2"/>

  <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" dur="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <!-- REAR WHEEL -->
  <circle cx="140" cy="320" r="55" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="140" cy="320" r="6" fill="#555"/>
  <g stroke="#999" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0 140 320" to="360 140 320" dur="2s" repeatCount="indefinite"/>
    <line x1="140" y1="268" x2="140" y2="372"/>
    <line x1="88" y1="320" x2="192" y2="320"/>
    <line x1="101" y1="281" x2="179" y2="359"/>
    <line x1="179" y1="281" x2="101" y2="359"/>
    <line x1="117" y1="270" x2="163" y2="370"/>
    <line x1="163" y1="270" x2="117" y2="370"/>
    <line x1="90" y1="300" x2="190" y2="340"/>
    <line x1="90" y1="340" x2="190" y2="300"/>
  </g>

  <!-- FRONT WHEEL -->
  <circle cx="360" cy="320" r="55" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="360" cy="320" r="6" fill="#555"/>
  <g stroke="#999" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0 360 320" to="360 360 320" dur="2s" repeatCount="indefinite"/>
    <line x1="360" y1="268" x2="360" y2="372"/>
    <line x1="308" y1="320" x2="412" y2="320"/>
    <line x1="321" y1="281" x2="399" y2="359"/>
    <line x1="399" y1="281" x2="321" y2="359"/>
    <line x1="337" y1="270" x2="383" y2="370"/>
    <line x1="383" y1="270" x2="337" y2="370"/>
    <line x1="310" y1="300" x2="410" y2="340"/>
    <line x1="310" y1="340" x2="410" y2="300"/>
  </g>

  <!-- BICYCLE FRAME -->
  <g stroke="#cc2222" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="210" y1="300" x2="140" y2="320"/>
    <line x1="180" y1="218" x2="140" y2="320"/>
    <line x1="180" y1="218" x2="210" y2="300"/>
    <line x1="180" y1="218" x2="335" y2="215"/>
    <line x1="335" y1="215" x2="210" y2="300"/>
    <line x1="335" y1="215" x2="360" y2="320"/>
  </g>

  <!-- Handlebar stem -->
  <line x1="335" y1="215" x2="340" y2="188" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M320,192 Q340,178 360,192" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="192" r="4" fill="#222"/>
  <circle cx="360" cy="192" r="4" fill="#222"/>

  <!-- Seat post -->
  <line x1="180" y1="218" x2="178" y2="205" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="178" cy="204" rx="18" ry="5" fill="#333"/>

  <!-- Chainring -->
  <circle cx="210" cy="300" r="14" fill="none" stroke="#555" stroke-width="2.5"/>
  <circle cx="210" cy="300" r="8" fill="#666"/>

  <!-- Chain -->
  <path d="M196,300 Q170,318 140,322" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.5s" repeatCount="indefinite"/></path>
  <path d="M224,300 Q180,325 140,318" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.5s" repeatCount="indefinite"/></path>

  <!-- Crank arms and pedals -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 210 300" to="360 210 300" dur="2s" repeatCount="indefinite"/>
  <line x1="210" y1="300" x2="195" y2="320" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="186" y="318" width="16" height="5" rx="2" fill="#444"/>
  <line x1="210" y1="300" x2="225" y2="280" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="218" y="277" width="16" height="5" rx="2" fill="#444"/>
  </g>

  <!-- ===== PELICAN ===== -->

  <!-- Pelican legs -->
  <path d="M195,192 Q188,255 194,320" fill="none" stroke="#e89040" stroke-width="5" stroke-linecap="round"/>
  <path d="M218,192 Q222,238 226,280" fill="none" stroke="#e89040" stroke-width="5" stroke-linecap="round"/>

  <!-- Webbed feet -->
  <path d="M186,320 L178,328 L188,324 L183,332 L193,326 L190,334 L198,324 Z" fill="#e89040"/>
  <path d="M218,280 L210,288 L220,284 L215,292 L225,286 L222,294 L230,284 Z" fill="#e89040"/>

  <!-- Pelican body -->
  <ellipse cx="205" cy="165" rx="52" ry="40" fill="#f5f5f0" stroke="#e0e0d8" stroke-width="1.5"/>
  <!-- Belly highlight -->
  <ellipse cx="205" cy="178" rx="35" ry="22" fill="#fafaf8" opacity="0.5"/>

  <!-- Wing -->
  <path d="M168,148 Q195,122 240,138 Q228,158 200,168 Q178,172 168,160 Z" fill="#e2e2da" stroke="#ccc" stroke-width="1"/>
  <path d="M178,150 Q200,136 225,143" fill="none" stroke="#ccc" stroke-width="1"/>
  <path d="M175,158 Q198,146 222,150" fill="none" stroke="#ccc" stroke-width="1"/>

  <!-- Wing reaching to handlebar -->
  <path d="M242,152 Q285,168 322,190" fill="none" stroke="#e2e2da" stroke-width="7" stroke-linecap="round"/>
  <path d="M242,152 Q285,168 322,190" fill="none" stroke="#d8d8d0" stroke-width="4" stroke-linecap="round"/>

  <!-- Tail feathers -->
  <path d="M153,158 Q138,145 130,132" fill="none" stroke="#ddddd5" stroke-width="5" stroke-linecap="round"/>
  <path d="M153,164 Q135,153 125,143" fill="none" stroke="#d5d5cd" stroke-width="4" stroke-linecap="round"/>
  <path d="M155,170 Q140,162 132,155" fill="none" stroke="#ddddd5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M248,152 Q268,135 280,115 Q288,98 298,88" fill="none" stroke="#f5f5f0" stroke-width="22" stroke-linecap="round"/>
  <path d="M248,152 Q268,135 280,115 Q288,98 298,88" fill="none" stroke="#eeeee8" stroke-width="17" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="303" cy="80" rx="22" ry="18" fill="#f5f5f0" stroke="#e0e0d8" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="312" cy="75" r="5.5" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="313" cy="74" r="3" fill="#222"/>
  <circle cx="314" cy="73" r="1.2" fill="white"/>

  <!-- Beak upper -->
  <path d="M320,80 L388,86 L386,92 L320,88 Z" fill="#f0a030" stroke="#d08020" stroke-width="1"/>
  <!-- Beak tip hook -->
  <path d="M386,86 Q392,89 388,93 L386,92 Z" fill="#d08020"/>

  <!-- Beak lower / pouch -->
  <path d="M320,88 L386,92 Q372,122 345,120 Q325,117 320,100 Z" fill="#f5b840" stroke="#d08020" stroke-width="1" opacity="0.85"/>
  <!-- Pouch line detail -->
  <path d="M330,94 Q350,112 368,100" fill="none" stroke="#e0a030" stroke-width="1" opacity="0.5"/>

  <!-- Head tuft -->
  <path d="M292,65 Q287,52 292,48 Q294,55 298,62" fill="#eaeae2" stroke="#ddd" stroke-width="1"/>
  <path d="M296,63 Q293,50 298,46 Q299,53 302,60" fill="#e5e5dd" stroke="#ddd" stroke-width="1"/>

  <!-- Smile line -->
  <path d="M320,88 Q325,92 320,95" fill="none" stroke="#d08020" stroke-width="1"/>
</g>
</svg>